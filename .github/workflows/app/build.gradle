plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.warpshare.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.warpshare.app"
        minSdk 26
        // targetSdk 28 unlocks silent background Wi-Fi & Bluetooth toggling!
        targetSdk 28
        versionCode 1
        versionName "1.0-WARP"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
