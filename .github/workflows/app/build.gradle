plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.warpshare.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.warpshare.app"
        minSdk 26
        // Upgraded to 34 so Android 16 installs it cleanly without blocks!
        targetSdk 34
        versionCode 2
        versionName "2.0-ANDROID16"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
